<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <title>연꾸 - 연락처 꾸미기</title>
    <meta
      name="description"
      content="VCF 연락처를 가져와 접두사·접미사를 일괄 편집하고 다시 내보내는 도구. 모든 데이터는 기기 안에만 저장됩니다."
    />

    <!-- 본문 서체(Pretendard). 자소 조합이 필요한 한글만 골라 받도록
         유니코드 구간별로 쪼갠 서브셋을 쓴다. -->
    <link rel="stylesheet" href="/fonts/pretendard.css" />

    <!-- 91·90번 구간에 라틴 문자와 사용 빈도가 가장 높은 한글이 들어 있다.
         이 둘만 미리 받아도 첫 화면 글자가 거의 다 제 서체로 그려진다. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/woff2-dynamic-subset/PretendardVariable.subset.91.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/woff2-dynamic-subset/PretendardVariable.subset.90.woff2"
      crossorigin
    />

    <!-- 첫 페인트 전에 저장된 테마를 입혀 흰 화면 번쩍임을 막는다 -->
    <script>
      (function () {
        try {
          var id = localStorage.getItem("theme-id") || "soft-blue-light";
          document.documentElement.setAttribute("data-theme", id);
          if (/-dark$/.test(id)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* localStorage가 막혀 있으면 기본 테마로 둔다 */
        }
      })();
    </script>

    <!-- PWA -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f8fa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1114"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="연꾸" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
